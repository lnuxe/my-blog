<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg —— 本站的图标 sprite（只收录页面真正用到的图标），共 22 个
  ───────────────────────────────────────────────────────────────────────────
  用法（页面内，相对路径，file:// 双击打开同样有效）：
      <svg class="i" aria-hidden="true" focusable="false"><use href="assets/icons.svg#tabler-sun"></use></svg>
  根目录页面用 assets/icons.svg，posts/ 下的页面用 ../assets/icons.svg。
  图标本身不写死颜色：stroke="currentColor"，颜色由 CSS 的 color 决定。
  所有符号都是 24×24 画布、线性（stroke）图标、默认线宽 2 —— 与 Tabler 一致。

  图标来源与许可
  ───────────────────────────────────────────────────────────────────────────
  全部取自 Tabler Icons  ——  https://github.com/tabler/tabler-icons  ·  https://tabler.io/icons
  版本基准：v3（outline 图标集）
  许可：MIT License，Copyright (c) 2020-2024 Paweł Kuna
        https://github.com/tabler/tabler-icons/blob/master/LICENSE
  本站只内联了下面这 22 个图标的 path 数据，没有打包整个图标库，
  也没有任何外部请求（无 CDN / 无 Web Font）。

  清单（id · 用途）
  ───────────────────────────────────────────────────────────────────────────
  01  tabler-sun            主题切换：浅色                 (Tabler: sun)
  02  tabler-moon           主题切换：深色                 (Tabler: moon)
  03  tabler-menu-2         移动端导航：打开                (Tabler: menu-2)
  04  tabler-x              移动端导航 / 搜索：关闭          (Tabler: x)
  05  tabler-search         文章搜索                       (Tabler: search)
  06  tabler-arrow-up       回到顶部                       (Tabler: arrow-up)
  07  tabler-archive        浏览全部文章                    (Tabler: archive)
  08  tabler-folders        开源项目                       (Tabler: folders)
  09  tabler-rss            RSS 订阅                      (Tabler: rss)
  10  tabler-code           首页标签 / 精选项目：前端        (Tabler: code)
  11  tabler-brand-github   GitHub 仓库链接                (Tabler: brand-github)
  12  tabler-external-link  在线 Demo / 外部链接            (Tabler: external-link)
  13  tabler-bolt           首页标签 / 精选项目：自动化      (Tabler: bolt)
  14  tabler-check          校验清单                       (Tabler: check)
  15  tabler-copy           代码块复制                     (Tabler: copy)
  16  tabler-chevron-right  阅读全文 / 指向性箭头            (Tabler: chevron-right)
  17  tabler-calendar       文章日期                       (Tabler: calendar)
  18  tabler-tag            文章标签                       (Tabler: tag)
  19  tabler-book-2         阅读时长                       (Tabler: book-2)
  20  tabler-clock-hour-4   阅读约 X 分钟                  (Tabler: clock-hour-4)
  21  tabler-alert-triangle 正文提示框                     (Tabler: alert-triangle)
  22  tabler-quote          侧栏引文标记                    (Tabler: quote)
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <!-- 站点标志：石板蓝 → 沙色，取自头像的天空与围巾 -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#506478"/>
      <stop offset="1" stop-color="#8c7a63"/>
    </linearGradient>
  </defs>

  <symbol id="tabler-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
    <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/>
  </symbol>
