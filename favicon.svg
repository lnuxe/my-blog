<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SupermanCantFly">
  <title>SupermanCantFly</title>
  <defs>
    <!-- 站点调色板就是这块图标上的三层：
           石板蓝 #506478  冬日天空   —— 底
           纸白   #f2f1ec  连帽衫     —— 兜帽
           沙色   #b4a08c  格纹围巾   —— 最下面那一条

         母题取自站长的头像插画：兜帽拉起来、围巾挡住下半张脸、视线低垂。
         只留"兜帽 + 一张被围巾截住的脸 + 格纹围巾"三个形状 —— 16×16 时
         每个形状只剩几个像素，再多一笔就糊成一团。原来那支上箭头是通用图标，
         与这个站没有任何关系，所以整块重画。

         围巾最后做成**单行四格**：先试的是两行错开的正经格纹，按 16×16
         光栅化后两行在 2px 内被平均掉，糊成一条脏灰带；单行四格在 16px
         下每格正好 4px 宽，格纹才真的看得出来。

         这个文件就是页头 / 页脚那枚标志的唯一来源：12 个页面都用
             <img class="brand-mark" src="favicon.svg" width="32" height="32" alt="…">
         直接引用它本身，所以"浏览器标签页上的图标"和"页头挂的标志"
         永远是同一个文件，不可能再对不上。
         不放进 assets/icons.svg 的 sprite 里，是因为 file:// 下 Chrome / Firefox
         会拒绝跨文档的 SVG <use> 外部引用 —— 那会让"双击 HTML 离线阅读"时
         页头只剩文字。<img> 引用同目录的 svg 不受这条限制。 -->
    <clipPath id="scf-tile"><rect width="64" height="64" rx="9"/></clipPath>
  </defs>
  <g clip-path="url(#scf-tile)">
    <rect width="64" height="64" fill="#506478"/>
    <path d="M32 5C21.5 5 13 14.7 13 27.4V48h38V27.4C51 14.7 42.5 5 32 5Z" fill="#f2f1ec"/>
    <path d="M32 20c-6.6 0-11 5-11 11.4 0 6.1 3 12.7 6.5 16.6h9c3.5-3.9 6.5-10.5 6.5-16.6C43 25 38.6 20 32 20Z" fill="#141519"/>
    <g>
      <rect x="0" y="45" width="16" height="19" fill="#b4a08c"/>
      <rect x="16" y="45" width="16" height="19" fill="#8c7a63"/>
      <rect x="32" y="45" width="16" height="19" fill="#b4a08c"/>
      <rect x="48" y="45" width="16" height="19" fill="#8c7a63"/>
    </g>
  </g>
</svg>
